name: Weekly Shelf Healthcheck & Sunset Auditor

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit-registry:
    name: Audit Link Rottenness & Sunset Dead Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Schema and Structure
        run: npx tsx scripts/validate-shelf.ts

      - name: Ping and Validate Live Endpoints (Intelligent Link Rot Check)
        run: npx tsx scripts/check-links.ts

      - name: Audit Chronic Link Rot & Prepare Sunset
        run: npx tsx scripts/sunset-resources.ts

      - name: Open Automated Sunset Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .sunset-pr-metadata.json ]; then
            BRANCH_NAME=$(node -e "console.log(require('./.sunset-pr-metadata.json').branchName)")
            PR_TITLE=$(node -e "console.log(require('./.sunset-pr-metadata.json').prTitle)")
            PR_BODY=$(node -e "console.log(require('./.sunset-pr-metadata.json').prBody)")
            
            git config --global user.name "DevShelf Bot"
            git config --global user.email "bot@devshelf.local"
            
            git checkout -b "$BRANCH_NAME"
            git add shelf/ README.md site/
            git commit -m "$PR_TITLE"
            git push origin "$BRANCH_NAME" --force
            
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --head "$BRANCH_NAME" --base main
            rm -f .sunset-pr-metadata.json
          else
            echo "Zero resources eligible for sunset. No PR required."
          fi

      - name: Open Consolidated Weekly Rotten Link Digest Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run issues:rot

      - name: Commit Fresh Uptime Telemetry and Maintained Shelf to Main
        run: |
          git config --global user.name "DevShelf Bot"
          git config --global user.email "bot@devshelf.local"
          git add site/uptime.json shelf/
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): update 7-day uptime metrics & maintenance flags [skip ci]"
            git push origin main
          fi
